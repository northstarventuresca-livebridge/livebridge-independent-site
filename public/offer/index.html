<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveBridge Private Offer</title>
<style>
*{box-sizing:border-box}
:root{--navy:#07192b;--ink:#0b2138;--muted:#61778d;--cyan:#58d8ff;--green:#28d99a}
body{margin:0;min-height:100vh;font-family:Inter,Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,rgba(49,152,255,.20),transparent 28%),radial-gradient(circle at 88% 7%,rgba(102,70,255,.16),transparent 25%),linear-gradient(145deg,#061421,#08243d 54%,#0a3152)}
.shell{max-width:1180px;margin:auto;padding:34px 24px 70px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}
.brand{font-size:30px;font-weight:950;letter-spacing:-1.2px}
.brandMark{display:inline-block;width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--cyan));box-shadow:0 0 28px rgba(88,216,255,.45);margin-right:8px;vertical-align:2px}
.tag{margin-top:4px;color:#82dfff;font-size:11px;font-weight:900;letter-spacing:2.1px}
.secureTop{color:#b9cad9;font-size:12px;display:flex;align-items:center;gap:8px}
.secureDot{width:8px;height:8px;border-radius:50%;background:#3be5a5;box-shadow:0 0 14px rgba(59,229,165,.55)}
.card{background:#fff;color:var(--ink);border-radius:30px;overflow:hidden;box-shadow:0 35px 90px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.hero{position:relative;padding:54px 56px 46px;background:radial-gradient(circle at 90% 12%,rgba(26,167,255,.14),transparent 30%),linear-gradient(135deg,#fbfdff,#eef8ff 70%,#e8f6ff)}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-110px;border:1px solid rgba(26,167,255,.16)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border-radius:999px;background:#e8f5ff;color:#0d79b2;font-size:11px;font-weight:950;letter-spacing:1.5px}
.recipient{margin-top:20px;color:#5b7288;font-size:16px}.recipient strong{color:#163a59}
.plan{margin:16px 0 12px;font-size:54px;line-height:1.02;letter-spacing:-2px;font-weight:950;max-width:820px}
.desc{max-width:800px;color:#526b82;font-size:18px;line-height:1.65}
.priceRow{margin-top:34px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.price{font-size:58px;line-height:1;font-weight:950;letter-spacing:-1.7px;color:#081d32}
.interval{color:#61778d;font-size:17px;font-weight:800;padding-bottom:7px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px;max-width:830px}
.metric{padding:18px 20px;border-radius:17px;background:rgba(255,255,255,.88);border:1px solid #dbeaf5;box-shadow:0 9px 24px rgba(14,72,112,.05)}
.metricLabel{color:#7b91a7;text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-weight:900;margin-bottom:6px}
.metricValue{font-size:24px;font-weight:950}
.body{padding:42px 56px 50px}
.sectionTitle{font-size:13px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;color:#6f879d;margin-bottom:15px}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
.feature{display:flex;gap:10px;align-items:flex-start;padding:15px 16px;border-radius:14px;background:#f7fbfe;border:1px solid #e1edf6;color:#23445f;font-weight:750;line-height:1.4}
.check{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e5fff5;color:#0d9a68;font-size:12px;font-weight:950}
.note{margin-top:8px;padding:20px 22px;border-radius:16px;border:1px solid #dcebf5;border-left:4px solid #24aaf2;background:linear-gradient(135deg,#f8fcff,#f3f9fd);color:#49637a;line-height:1.65}
.details{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:30px;padding-top:24px;border-top:1px solid #e4edf4}
.expiry{color:#6b8194;font-size:13px;line-height:1.55}.trust{margin-top:5px;color:#96a6b5;font-size:11px}
.cta{min-width:260px;border:0;border-radius:15px;padding:18px 24px;background:linear-gradient(135deg,#2ed99e,#2fc8ea);color:#06263a;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 12px 28px rgba(38,209,164,.22);transition:.18s ease}
.cta:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(38,209,164,.30)}.cta:disabled{opacity:.55;cursor:not-allowed;transform:none}
.status{text-align:center;padding:75px 30px}.status h1{font-size:30px;margin:0 0 12px}
.error{color:#b42318;background:#fff2f0;border:1px solid #ffd5d1;padding:15px 16px;border-radius:12px;margin-top:18px}
.footer{text-align:center;color:#9db6c9;font-size:11px;margin-top:18px}
@media(max-width:760px){.shell{padding:24px 14px 45px}.topbar{align-items:flex-start}.secureTop{display:none}.hero,.body{padding:32px 24px}.plan{font-size:38px;letter-spacing:-1.2px}.desc{font-size:16px}.price{font-size:44px}.metrics,.features{grid-template-columns:1fr}.details{grid-template-columns:1fr}.cta{width:100%;min-width:0}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <div class="brand"><span class="brandMark"></span>LiveBridge</div>
      <div class="tag">REAL-TIME MULTILINGUAL COMMUNICATION</div>
    </div>
    <div class="secureTop"><span class="secureDot"></span>Secure private offer</div>
  </div>
  <div class="card" id="offerCard"><div class="status">Loading your private offer…</div></div>
  <div class="footer">Private offer prepared through LiveBridge · Secure checkout powered by Stripe</div>
</div>
<script>
const WORKER="https://livebridge.northstarventures-ca.workers.dev";
let currentOffer=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function tokenFromUrl(){const parts=location.pathname.split("/").filter(Boolean);if(parts[0]==="offer"&&parts[1]&&parts[1]!=="index.html")return parts[1];return new URLSearchParams(location.search).get("token")||"";}
function money(plan){return new Intl.NumberFormat("en-CA",{style:"currency",currency:plan.currency||"CAD"}).format(Number(plan.priceCents||0)/100);}
function hours(minutes){const n=Math.max(0,Number(minutes||0));if(n===60)return "1 hour";if(n%60===0)return (n/60)+" hours";return (n/60).toFixed(1)+" hours";}
function expiryText(ts){if(!ts)return "No fixed expiration date";return "Offer valid until "+new Date(ts).toLocaleString([],{dateStyle:"long",timeStyle:"short"});}
function renderUnavailable(message){document.getElementById("offerCard").innerHTML=`<div class="status"><h1>Private Offer Unavailable</h1><div style="color:#688098;">This secure offer cannot currently be opened.</div><div class="error">${esc(message)}</div></div>`;}
function renderOffer(offer){
  currentOffer=offer;
  const p=offer.plan||{};
  const features=Array.isArray(p.features)?p.features:[];
  document.getElementById("offerCard").innerHTML=`
    <div class="hero">
      <div class="eyebrow">✦ PRIVATE LIVEBRIDGE OFFER</div>
      ${offer.recipientName?`<div class="recipient">Prepared exclusively for <strong>${esc(offer.recipientName)}</strong></div>`:""}
      <div class="plan">${esc(p.planName||"LiveBridge Plan")}</div>
      <div class="desc">${esc(p.description||"A tailored LiveBridge subscription prepared for your organization.")}</div>
      <div class="priceRow"><div class="price">${esc(money(p))}</div><div class="interval">per ${esc(p.billingInterval||"month")}</div></div>
      <div class="metrics">
        <div class="metric"><div class="metricLabel">Included Live Translation</div><div class="metricValue">${esc(hours(p.includedMinutes))}</div></div>
        <div class="metric"><div class="metricLabel">Simultaneous Listeners</div><div class="metricValue">${Number(p.viewerLimit||0)}</div></div>
      </div>
    </div>
    <div class="body">
      ${features.length?`<div class="sectionTitle">Included with your offer</div><div class="features">${features.map(f=>`<div class="feature"><span class="check">✓</span><span>${esc(f)}</span></div>`).join("")}</div>`:""}
      ${offer.note?`<div class="sectionTitle">A note for your organization</div><div class="note">${esc(offer.note)}</div>`:""}
      <div class="details">
        <div>
          <div class="expiry">${esc(expiryText(offer.expirationTimestamp))}${offer.recipientEmailRestricted?" · Restricted to the invited email address":""}</div>
          <div class="trust">Secure checkout · Subscription details confirmed before activation</div>
        </div>
        <button id="claimButton" class="cta">Continue to Secure Checkout →</button>
      </div>
      <div id="claimError"></div>
    </div>`;
  document.getElementById("claimButton").addEventListener("click",claimOffer);
}
async function loadOffer(){
  const token=tokenFromUrl();
  if(!token){renderUnavailable("This offer link is incomplete.");return;}
  try{
    const r=await fetch(WORKER+"/offer?token="+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok||!d.offer)throw new Error(d.error||"Offer could not be loaded.");
    if(!d.offer.active){
      renderUnavailable(d.offer.expired?"This offer has expired.":d.offer.exhausted?"This offer has already been redeemed.":"This offer is no longer active.");
      return;
    }
    renderOffer(d.offer);
  }catch(e){renderUnavailable(e.message||"Unable to load this private offer.");}
}
async function claimOffer(){
  const button=document.getElementById("claimButton");
  const box=document.getElementById("claimError");
  button.disabled=true;
  button.textContent="Opening secure checkout…";
  box.innerHTML="";
  try{
    const r=await fetch(WORKER+"/stripe/create-offer-checkout-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:currentOffer.token})});
    const d=await r.json();
    if(!r.ok||!d.checkoutUrl)throw new Error(d.error||"Unable to open checkout.");
    location.href=d.checkoutUrl;
  }catch(e){
    box.innerHTML=`<div class="error">${esc(e.message||"Unable to open checkout.")}</div>`;
    button.disabled=false;
    button.textContent="Continue to Secure Checkout →";
  }
}
loadOffer();
</script>
</body>
</html>
